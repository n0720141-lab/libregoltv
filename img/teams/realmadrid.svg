  <g clip-path="url(#circleClip)">
    <polygon points="15,48 35,48 85,100 65,100" fill="#6366f1"/>
    <!-- MFC Monogram -->
    <text x="50" y="82" fill="#f59e0b" font-family="'Times New Roman', serif" font-weight="900" font-size="28" text-anchor="middle">MFC</text>
  </g>
</svg>
