<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Real Madrid Crest -->
  <!-- Crown on Top -->
  <path d="M 30 25 L 36 34 L 50 20 L 64 34 L 70 25 L 75 38 L 25 38 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="50" cy="18" r="3.5" fill="#f59e0b"/>
  <circle cx="30" cy="23" r="2.5" fill="#f59e0b"/>
  <circle cx="70" cy="23" r="2.5" fill="#f59e0b"/>
  <!-- Circular Badge -->
  <circle cx="50" cy="74" r="38" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
  <!-- Diagonal Purple Stripe -->
  <clipPath id="circleClip">
    <circle cx="50" cy="74" r="36"/>
