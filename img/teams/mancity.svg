<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Manchester City Crest -->
  <circle cx="50" cy="50" r="48" fill="#6cabdd" stroke="#001838" stroke-width="3"/>
  <circle cx="50" cy="50" r="43" fill="#ffffff"/>
  <circle cx="50" cy="50" r="34" fill="#001838"/>
  <circle cx="50" cy="50" r="30" fill="#6cabdd"/>
  <!-- Golden Ship -->
  <path d="M 36 44 L 64 44 L 58 52 L 42 52 Z" fill="#ffd100"/>
  <polygon points="50,34 50,42 58,42" fill="#ffd100"/>
  <!-- Red Rose of Lancashire -->
  <circle cx="50" cy="62" r="6" fill="#e31b23"/>
  <!-- Inner Ring & Text -->
  <path d="M 40 22 C 45 20 55 20 60 22" fill="none"/>
  <text x="50" y="24" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="8" text-anchor="middle">CITY</text>
  <text x="50" y="80" fill="#ffffff" font-family="Arial, sans-serif" font-weight="800" font-size="6" text-anchor="middle">1894</text>
</svg>
