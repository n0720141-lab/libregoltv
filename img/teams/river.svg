<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- River Plate Crest -->
  <defs>
    <clipPath id="riverClip">
      <path d="M 12 10 L 88 10 C 88 65 72 98 50 115 C 28 98 12 65 12 10 Z"/>
    </clipPath>
  </defs>
  <!-- Base Shield -->
  <path d="M 12 10 L 88 10 C 88 65 72 98 50 115 C 28 98 12 65 12 10 Z" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <!-- Diagonal Red Stripe -->
  <g clip-path="url(#riverClip)">
    <polygon points="12,10 40,10 88,90 88,115 60,115 12,35" fill="#e11d48"/>
    <!-- CARP Monogram Badge in center -->
    <circle cx="50" cy="58" r="22" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="50" y="65" fill="#111827" font-family="Arial, sans-serif" font-weight="900" font-size="14" letter-spacing="-0.5" text-anchor="middle">CARP</text>
  </g>
</svg>
