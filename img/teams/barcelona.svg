<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- FC Barcelona Crest -->
  <defs>
    <clipPath id="barcaClip">
      <path d="M 15 15 C 30 10 70 10 85 15 C 88 50 82 85 50 115 C 18 85 12 50 15 15 Z"/>
    </clipPath>
  </defs>
  <!-- Shield Base -->
  <path d="M 15 15 C 30 10 70 10 85 15 C 88 50 82 85 50 115 C 18 85 12 50 15 15 Z" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <g clip-path="url(#barcaClip)">
    <!-- Top Left: St George Cross -->
    <rect x="15" y="15" width="35" height="35" fill="#ffffff"/>
    <rect x="29" y="15" width="7" height="35" fill="#dc2626"/>
    <rect x="15" y="29" width="35" height="7" fill="#dc2626"/>
    <!-- Top Right: Catalan Stripes -->
    <rect x="50" y="15" width="35" height="35" fill="#facc15"/>
    <rect x="57" y="15" width="5" height="35" fill="#dc2626"/>
    <rect x="69" y="15" width="5" height="35" fill="#dc2626"/>
    <!-- Middle Band -->
    <rect x="15" y="50" width="70" height="12" fill="#facc15"/>
    <text x="50" y="60" fill="#1e3a8a" font-family="Arial, sans-serif" font-weight="900" font-size="10" text-anchor="middle">FCB</text>
    <!-- Bottom: Blaugrana Stripes -->
    <rect x="15" y="62" width="70" height="55" fill="#1e3a8a"/>
    <rect x="30" y="62" width="10" height="55" fill="#991b1b"/>
    <rect x="50" y="62" width="10" height="55" fill="#991b1b"/>
    <rect x="70" y="62" width="10" height="55" fill="#991b1b"/>
    <!-- Soccer ball in center bottom -->
    <circle cx="50" cy="85" r="10" fill="#facc15" stroke="#78350f" stroke-width="1.5"/>
  </g>
</svg>
